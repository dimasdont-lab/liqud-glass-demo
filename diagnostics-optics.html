<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RGB та скло</title><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:white;font:18px system-ui}.app{min-height:1600px;background:repeating-linear-gradient(0deg,#080808 0 26px,#fff 26px 29px,#080808 29px 65px);padding:85px 8px}.app p{background:#080808;font-size:28px;font-weight:700;margin:35px 0;white-space:nowrap}.controls{position:fixed;top:0;left:0;right:0;z-index:10;background:#222;padding:8px;display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;color:white;background:#444;border:1px solid #888;padding:8px;border-radius:10px;min-height:44px}.shapes{position:fixed;left:10px;right:10px;top:125px;display:flex;gap:8px;align-items:center}.glass{position:relative;border:1px solid #aaa;border-radius:36px;height:72px;overflow:hidden}.circle{width:72px;flex-shrink:0}.pill{flex:1;min-width:60px}.capsule{width:95px;flex-shrink:0}.panel{position:fixed;left:10px;right:10px;top:225px;height:90px;border-radius:24px}.layer{position:absolute;inset:0;overflow:hidden}.vf-mirror-content{position:absolute;display:block;overflow:hidden;pointer-events:none;contain:paint}.vf-rgb-content,.vf-rgb-region{isolation:isolate;background:#000}.vf-rgb-region,.vf-rgb-channel{position:absolute;inset:0;pointer-events:none}.vf-rgb-channel{mix-blend-mode:screen}.vf-mirror-copy{position:absolute!important;max-width:none!important;margin:0!important;pointer-events:none!important}
</style><div class="app"><p>WHITE RGB 0123456789</p><p>WHITE RGB 0123456789</p><p>WHITE RGB 0123456789</p><p>WHITE RGB 0123456789</p><p>WHITE RGB 0123456789</p><p>WHITE RGB 0123456789</p><p>WHITE RGB 0123456789</p><p>WHITE RGB 0123456789</p><p>WHITE RGB 0123456789</p></div><div class="controls"><button id="rgb" aria-pressed="true">RGB: увімкнено</button><button id="blur" aria-pressed="false">Розмиття: вимкнено</button><button id="zoom" aria-pressed="false">Зум: 1×</button></div><div class="shapes"><div class="glass circle"></div><div class="glass pill"></div><div class="glass capsule"></div></div><div class="glass panel"></div><script src="diagnostic-errors.js?v=107"></script><script src="mirror-runtime.js?v=107"></script><script>
let rgb=true,blur=false,zoom=false;const hosts=[...document.querySelectorAll('.glass')];for(const host of hosts){const center=document.createElement('span'),edge=document.createElement('span');center.className=edge.className='layer';host.append(center,edge)}
function render(){for(const host of hosts){const w=host.clientWidth,h=host.clientHeight,r=Math.min(parseFloat(getComputedStyle(host).borderTopLeftRadius)||0,h/2),d=12,innerR=Math.max(0,r-d);const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><path fill="white" fill-rule="evenodd" d="M ${r} 0 H ${w-r} Q ${w} 0 ${w} ${r} V ${h-r} Q ${w} ${h} ${w-r} ${h} H ${r} Q 0 ${h} 0 ${h-r} V ${r} Q 0 0 ${r} 0 Z M ${d+innerR} ${d} H ${w-d-innerR} Q ${w-d} ${d} ${w-d} ${d+innerR} V ${h-d-innerR} Q ${w-d} ${h-d} ${w-d-innerR} ${h-d} H ${d+innerR} Q ${d} ${h-d} ${d} ${h-d-innerR} V ${d+innerR} Q ${d} ${d} ${d+innerR} ${d} Z"/></svg>`;const [center,edge]=host.children;edge.style.maskImage=edge.style.webkitMaskImage=`url("data:image/svg+xml,${encodeURIComponent(svg)}")`;VFMirror.update(center,host,zoom ? .85 : 1,0,1);VFMirror.update(edge,host,zoom ? .85 : 1,blur?3:0,1,{enabled:rgb,strength:6,direction:1})}parent.postMessage({source:'vf-optics-diagnostic',rgb,blur,zoom,scrollY},location.origin)}
for(const name of ['rgb','blur','zoom'])document.querySelector('#'+name).onclick=e=>{if(name==='rgb')rgb=!rgb;if(name==='blur')blur=!blur;if(name==='zoom')zoom=!zoom;e.target.setAttribute('aria-pressed',String(name==='rgb'?rgb:name==='blur'?blur:zoom));e.target.textContent=name==='rgb'?`RGB: ${rgb?'увімкнено':'вимкнено'}`:name==='blur'?`Розмиття: ${blur?'увімкнено':'вимкнено'}`:`Зум: ${zoom?'0.85':'1'}×`;render()};addEventListener('resize',render);addEventListener('scroll',()=>parent.postMessage({source:'vf-optics-diagnostic',rgb,blur,zoom,scrollY},location.origin),{passive:true});render();
</script></html>
